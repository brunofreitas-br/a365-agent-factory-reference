$schema: https://json-schema.org/draft/2020-12/schema
# Exemplo de solicitação. Atualize review_date para uma data futura antes de copiar
# este arquivo para requests/<agent_name>.yaml.

agent_name: classificador-de-chamados
display_name: Classificador de Chamados
purpose: >-
  Lê chamados abertos na fila de suporte de TI, classifica por categoria e
  urgência, e grava a classificação de volta no chamado.

business_owner: owner@contoso.com
technical_owner: engineer@contoso.com

# agent | ai-teammate — esta referência provisiona apenas "agent".
agent_kind: agent

# s2s | obo — o fluxo validado nesta referência utiliza s2s.
auth_mode: s2s

environment: dev

# publico | interno | confidencial | restrito
data_sensitivity: interno

writes: true
autonomous: true

audience:
  - suporte-ti@contoso.com

# Só permitido com auth_mode: obo.
workiq_tools: []

review_date: "2027-12-31"
